claims:   # the paper's claims (research/extraction/dejong_dlc.md) and what this replication found
  - {id: C1, claim: "Large, persistent deviations from parity in every DLC", verdict: reproduced, evidence: "Table II: 58/72 statistics within rounding; deviation series equal to the authors' column to 4.4e-16"}
  - {id: C2, claim: "Relative returns co-move with local indices and exchange rates", verdict: reproduced, evidence: "Table III: 77/84 within rounding, 48/48 significance marks"}
  - {id: C3, claim: "Threshold arbitrage earns abnormal returns of up to ~10% p.a. after costs", verdict: "reproduced under the paper's conventions; not robust to execution", evidence: "FF3 alphas within 0.15% p.m. (benchmark 0.794 vs 0.718); trading one close later removes 56% of the return"}
  - {id: C4, claim: "Arbitrage risk is idiosyncratic and fat-tailed, ~30% volatility", verdict: reproduced, evidence: "R² ~0.003; sigma 26-36 vs 31-35; kurtosis high (driven by the Dexia spike)"}
  - {id: C5, claim: "Time zones and currencies do not explain the mispricing (ADR test)", verdict: "challenged (no ADR test here)", evidence: "Australian twins (10 h) lose 85% of their return when trades follow the signal by one close: much of the return is non-synchronous noise"}
  - {id: C6, claim: "Taxes, governance, short-sale constraints explain little", verdict: "not tested", evidence: ""}
  - {id: C7, claim: "Prices converge within days of a unification announcement", verdict: "not tested directly; the strategies hold positions into the announcement (D20)", evidence: ""}
