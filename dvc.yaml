# DVC pipeline DAG. Reproduce everything that is out of date with:
#
#     uv run dvc repro
#
# Raw data enters with `dvc add data/raw/<dataset>` (never produced by a stage,
# because vendor downloads are not reproducible). Every stage below is a pure
# function of its deps + params, so `dvc repro` on any commit rebuilds exactly
# the processed data that commit saw.
#
#   data/raw/datastream_dlc (dvc add) --ingest--> data/interim/<pair> --preprocess--> data/processed/<pair>
#   data/raw/synthetic_twin (dvc add) ---------------------------------preprocess--> data/processed/synthetic_twin
#
# Unilever.zip is not ingested by the lab's `ingest` stage (unusable NV volume,
# research/reports/data_decisions.md); the paper replication (`dlc_ingest`) uses
# it, as its rules need no volume.

stages:
  ingest:
    foreach:
      - rd_shell
      - reed_elsevier
      - rio_tinto
    do:
      cmd: python -m quant_lab.data.datastream --dataset ${item}
      deps:
        - data/raw/datastream_dlc
        - src/quant_lab/data/datastream.py
      params:
        - conf/data/${item}.yaml:
            - legs
            - raw_dir
            - source
      outs:
        - data/interim/${item}
      metrics:
        - data/interim/${item}.ingest.json:
            cache: false

  # de Jong, Rosenthal & van Dijk (2009) replication: paper-convention twin panels
  # (all workbook rows in the paper's Table II window, deviation checked against
  # the authors' own column). Independent of the lab's ingest/preprocess above.
  dlc_ingest:
    foreach:
      - abb
      - bhp_billiton
      - brambles
      - dexia
      - fortis
      - merita_nordbanken
      - rd_shell
      - reed_elsevier
      - rio_tinto
      - smithkline
      - unilever
      - zurich_allied
    do:
      cmd: python -m quant_lab.data.dlc --twin ${item}
      deps:
        - data/raw/datastream_dlc
        - src/quant_lab/data/dlc.py
        - src/quant_lab/data/datastream.py
      params:
        - conf/dlc/${item}.yaml:
            - window
            - source
            - interim_path
            - regression
            - trading
      outs:
        - data/interim/dlc/${item}.parquet
        - data/interim/dlc/${item}.regression.parquet
        - data/interim/dlc/${item}.trading.parquet
      metrics:
        - data/interim/dlc/${item}.ingest.json:
            cache: false

  preprocess:
    foreach:
      synthetic_twin:
        input: data/raw/synthetic_twin
      rd_shell:
        input: data/interim/rd_shell
      reed_elsevier:
        input: data/interim/reed_elsevier
      rio_tinto:
        input: data/interim/rio_tinto
    do:
      cmd: python -m quant_lab.data.preprocess --dataset ${key}
      deps:
        - ${item.input}
        - src/quant_lab/data/loaders.py
        - src/quant_lab/data/validation.py
        - src/quant_lab/data/synchronization.py
        - src/quant_lab/data/preprocess.py
      params:
        - conf/data/${key}.yaml:
            - legs
            - alignment
            - validation
      outs:
        - data/processed/${key}/panel.parquet
      metrics:
        - data/processed/${key}/validation.json:
            cache: false
