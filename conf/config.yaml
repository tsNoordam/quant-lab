# Root Hydra config for backtests.
#
#   uv run python -m quant_lab.backtest.run                          # train period
#   uv run python -m quant_lab.backtest.run backtest.period=validation
#   uv run python -m quant_lab.backtest.run -m strategy.window=40,60,80   # sweep
#
# Every run logs params, metrics, provenance tags and artifacts to MLflow:
#   uv run mlflow ui --backend-store-uri sqlite:///mlflow.db

defaults:
  - data: synthetic_twin
  - split: synthetic_twin
  - strategy: parity_zscore
  - costs: flat_bps
  - backtest: default
  - _self_

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlartifacts
  experiment: ${data.name}.${strategy.name}
  # true: refuse to run with uncommitted changes (use for results you cite).
  # false: run anyway, but the run is tagged git_dirty=true.
  require_clean_tree: false

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
