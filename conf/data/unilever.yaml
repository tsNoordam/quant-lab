# Unilever NV (Amsterdam, EUR) / Unilever PLC (London, GBp). Twin pair in Maymin (SILTA).
# Source: data/raw/datastream_dlc/Unilever.zip. Converted by quant_lab.data.datastream.

name: unilever
calendar: business_daily
legs:
  a: UNILEVER_NV
  b: UNILEVER_PLC
currency: GBP

# [EXTERNAL-RESEARCH] workbook's theoretical ratio in GBP per share; cross-check
# against UNILEVER eq agr.pdf.
parity_ratio: 6.67

raw_dir: data/interim/unilever
processed_dir: data/processed/unilever

source:
  archive: data/raw/datastream_dlc/Unilever.zip
  workbook: Unilever data.xls
  volume_sheet: Regression data
  volume_multiplier: 1000
  # [IMPLEMENTATION-ASSUMPTION] window = where both legs have daily volume. The NV
  # price is stale on most days before ~1993 and NV volume is patchy until 1997.
  window:
    start: "1998-01-01"
    end: "2002-10-03"
  legs:
    a:
      sheet: UNILEVER NV
      price: 932911(P)
      total_return_index: 932911(RI)
      fx_per_unit: "# NLG(€) per £"
      price_scale: 1.0
      quote_scale: 1.0
      volume: TURNOVER BY VOLUME UNILEVER NV
      # NV bid/ask deliberately not used: the workbook's quotes (2000+) have median
      # spreads of 165-420 bps and the close lies outside them on 10% of days, which
      # is not the primary Amsterdam market for a mega-cap. Cost models must use a
      # modelled spread for this leg. ("BID PRICE UNILEVER NV" / "ASK PRICE UNILEVER NV")
    b:
      sheet: UNILEVER PLC
      price: 900789(P)
      total_return_index: 900789(RI)
      price_scale: 0.01
      quote_scale: 0.01
      volume: TURNOVER BY VOLUME UNILEVER PLC
      bid: BID PRICE UNILEVER PLC
      ask: ASK PRICE UNILEVER PLC

alignment:
  missing_policy: drop
  ffill_limit: 0

validation:
  max_missing_frac: 0.05
  max_abs_log_return: 0.25
