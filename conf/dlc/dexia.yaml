# Dexia France / Dexia Belgium. de Jong et al. (2009) paper-convention twin.
name: dexia
paper_name: Dexia
interim_path: data/interim/dlc/dexia.parquet
table_i: {countries: France/Belgium, time_diff_hours: 0, structure: combined entities,
          merger: "1996-11-19", unification_announced: "1999-09-19", unification: "1999-11-26"}
window: {start: "1996-11-19", end: "1999-08-20"}
# [PAPER-DERIVED, identified from Table IV days, D20] positions open at the end of a
# unified twin's window are closed on the first trading day after the announcement
trading: {rows_after_window: 21}
source:
  archive: data/raw/datastream_dlc/Dexia.zip
  workbook: Dexia data.xls
  legs:
    a: {sheet: Dexia France, price: 307419(P), total_return: 307419(RI), fx_per_b: "# FF(€) per BEF(€)"}
    b: {sheet: Dexia Belgium, price: 885000(P), total_return: 885000(RI)}
  ratio: {sheet: Ratio, theoretical_ratio: THEORETICAL RATIO, deviation: LOG DEVIATIONS FROM PARITY}
# Table III inputs. Indices as named on paper p. 501 (research/reports/dejong_table3.md).
regression:
  sheet: Regression data
  return_a: "TOTAL RETURN DEXIA FRANCE"
  return_b: "TOTAL RETURN DEXIA BELGIUM"
  fx: "FR. FR. (€)/ BELG. FR. (€)"
  index_a: "SBF 250 (BROAD FRENCH)"
  index_b: "BRUSSELS ALL SHARE"
  # [PAPER-DERIVED, identified from Table III, D15] the two return observations of
  # the 1997-12-19 price spike are not in the authors' regression sample; with them
  # removed every Table III value for Dexia is reproduced. The paper does not say so.
  exclude_dates: ["1997-12-19", "1997-12-22"]
  as_stated: {exclude_dates: []}
