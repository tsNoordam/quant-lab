# BHP Billiton Ltd (Sydney) / BHP Billiton PLC (London). de Jong et al. (2009) twin.
# Closes ~10 hours apart (non-synchronous).
name: bhp_billiton
paper_name: BHP Billiton
interim_path: data/interim/dlc/bhp_billiton.parquet
table_i: {countries: Australia/United Kingdom, time_diff_hours: -10, structure: separate entities,
          merger: "2001-06-29", unification_announced: null, unification: null}
window: {start: "2001-06-29", end: "2002-10-03"}
trading: {rows_after_window: 0}   # not unified in the sample: open positions are discarded
source:
  archive: data/raw/datastream_dlc/BHP.zip
  workbook: BHP Billiton data.xls
  legs:
    a: {sheet: BHP Billiton Ltd, price: 906169(P), total_return: 906169(RI), fx_per_b: "# AUS$ per £"}
    b: {sheet: BHP Billiton PLC, price: 899188(P), total_return: 899188(RI), price_scale: 0.01}
  ratio: {sheet: Ratio, theoretical_ratio: THEORETICAL RATIO, deviation: LOG DEVIATIONS FROM PARITY}
# Table III inputs. Indices as named on paper p. 501 (research/reports/dejong_table3.md).
regression:
  sheet: Regression data
  return_a: "TOTAL RETURN BHP Ltd"
  return_b: "TOTAL RETURN BHP PLC"
  fx: "AUS$/ BRITISH £"
  index_a: "ASX ALL ORD"
  index_b: "FTSE Allshare"
  exclude_dates: []
