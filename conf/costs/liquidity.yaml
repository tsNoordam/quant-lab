# Default cost model: costs scale with trade size and liquidity (CLAUDE.md).
#
# Per order, as a fraction of traded notional, applied as an adverse fill price:
#   half_spread + impact.coefficient * sigma * sqrt(shares / ADV) + buy_tax (purchases)
# plus commission on every order and a daily borrow fee on the short leg.
# All statistics are as of the decision close (lagged one bar relative to the fill).
# Implementation: src/quant_lab/backtest/costs.py

model: liquidity

commission_bps: 5.0          # [IMPLEMENTATION-ASSUMPTION] institutional commission per order

spread:
  lookback_days: 20          # rolling median of the quoted half-spread
  min_quote_days: 10         # fewer quoted days in the window -> fallback
  fallback_half_spread_bps: 10.0  # [IMPLEMENTATION-ASSUMPTION] used when quotes are missing

impact:
  # Square-root law: impact = k * daily sigma * sqrt(Q / ADV).
  # [EXTERNAL-RESEARCH] k of order 0.5-1 is typical in the market-impact literature
  # (e.g. Almgren et al. 2005; Toth et al. 2011); 1.0 is the conservative end.
  coefficient: 1.0
  vol_lookback_days: 60
  adv_lookback_days: 20

# Orders in a leg quoted in a foreign currency (data.source.legs.<leg>.fx_per_unit,
# e.g. Royal Dutch in EUR for a GBP desk) also pay a spot FX conversion cost.
fx_conversion_bps: 3.0       # [IMPLEMENTATION-ASSUMPTION] institutional spot FX, per order

borrow_bps_annual: 50.0     # [IMPLEMENTATION-ASSUMPTION] stock loan fee on the short leg

# UK stamp duty is 50 bps on cash purchases of UK shares; arbitrage desks usually
# avoid it (intermediary relief, swaps/CFDs). 0 = assume relief; set 50 as a
# sensitivity case. Applied to every purchase on both legs.
buy_tax_bps: 0.0

limits:
  # [PAPER-DERIVED example] Maymin describes self-imposed limits such as trading
  # at most ~15% of daily volume. An entry may not trade more than this fraction
  # of either leg's ADV; larger targets are scaled down (logged as entries_capped).
  max_participation: 0.15
