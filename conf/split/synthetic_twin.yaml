# LOCKED train / validation / out-of-sample boundaries (inclusive dates).
#
# The backtest runner refuses `split.*` overrides on the command line, so these
# dates change only by editing this file in a commit. Running on `oos` also
# requires `+unlock_oos=true`, which is recorded as an MLflow tag.
#
# Develop on train, compare variants on validation, look at OOS once.

name: synthetic_twin
train:
  start: "2000-01-03"
  end: "2005-12-30"
validation:
  start: "2006-01-02"
  end: "2007-12-31"
oos:
  start: "2008-01-01"
  end: "2009-08-28"
