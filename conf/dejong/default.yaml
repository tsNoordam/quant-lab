# de Jong, Rosenthal & van Dijk (2009): the arbitrage strategies of Tables IV-V
# under the paper's own conventions (quant_lab.backtest.dejong, ROADMAP step 16).
# Plain OmegaConf, like conf/dlc/. Tags and the D numbers refer to
# research/assumptions/dejong_dlc.md; research/reports/dejong_tables45.md has
# the evidence for every identified convention.

benchmark: 10/5/12m                  # Table IV [PAPER-DERIVED]
strategies:                          # Table V [PAPER-DERIVED]; horizon in trading days, null = unlimited
  5/1/1m: {buy: 0.05, sell: 0.01, horizon: 22}
  5/1/3m: {buy: 0.05, sell: 0.01, horizon: 65}
  5/1/12m: {buy: 0.05, sell: 0.01, horizon: 260}
  5/1/inf: {buy: 0.05, sell: 0.01, horizon: null}
  10/5/1m: {buy: 0.10, sell: 0.05, horizon: 22}
  10/5/3m: {buy: 0.10, sell: 0.05, horizon: 65}
  10/5/12m: {buy: 0.10, sell: 0.05, horizon: 260}
  10/5/inf: {buy: 0.10, sell: 0.05, horizon: null}

rules:
  # [PAPER-DERIVED, identified, D6] a position opens on a crossing: |d| >= buy on
  # the signal day and < buy the day before.
  entry: crossing
  # [PAPER-DERIVED, identified, D4] trades at the close on which the signal is
  # observed (delay 0). The paper's "one extra day" sensitivity is delay 1.
  delay: 0
  month_days: 22                     # [PAPER-DERIVED] one month = 22 trading days
  # [PAPER-DERIVED] at most one position per twin; [identified, D5] the proceeds of
  # a position shorter than a month stay in the T-bill until the month is over, so
  # the next position can start 22 trading days after the previous entry at the earliest.
  lockout_days: 22
  # [PAPER-DERIVED] open positions at the sample end are discarded; [identified, D20]
  # for twins unified in the sample they are closed on the trading panel's last
  # row, the first trading day after the unification announcement
  # (conf/dlc/<twin>.yaml trading.rows_after_window).
  hold_after_window: true
  open_at_end: discard               # discard | mark (close at the last close)

account:
  # [PAPER-DERIVED] Regulation T: 50% initial margin on each leg, maintenance 25%
  # long and 30% short, partial liquidation of both legs on a margin call.
  initial_margin: 0.50
  maintenance_long: 0.25
  maintenance_short: 0.30
  # [IMPLEMENTATION-ASSUMPTION, D10] per_leg: each leg's own equity against its own
  # maintenance requirement; pooled: account equity against the sum. Neither
  # reproduces the paper's margin-call counts (report); per_leg reads the text
  # ("25% for long positions and 30% for short positions").
  margin_rule: per_leg
  # [PAPER-DERIVED] fixed rates per year: cash 5%, margin loan 5.5%, short rebate 3%.
  cash_rate: 0.05
  loan_rate: 0.055
  rebate_rate: 0.03
  # [PAPER-DERIVED, identified, D21] the 50% margin deposit of the short sale is
  # collateral and earns nothing; "cash" is free cash only.
  short_deposit_earns: false
  days_per_year: 260                 # [IMPLEMENTATION-ASSUMPTION] interest per trading day

costs:
  commission: 0.0025                 # [PAPER-DERIVED] 25 bps per transaction, every leg
  half_spread: 0.0020                # [PAPER-DERIVED] half of a 40 bps spread
  # [PAPER-DERIVED, identified, D3] the half spread is paid at exit as well.
  spread_at_exit: true

returns:
  # [PAPER-DERIVED, identified, D19] leg returns in one currency (A converted to
  # B's), so a position's P&L follows the parity deviation.
  currency: common
  # [IMPLEMENTATION-ASSUMPTION, D2] total-return indices (dividends included).
  total_return: true
  # [PAPER-DERIVED, D5] % per month = total return x 22 / days, days at least 22;
  # positions shorter than a month earn the 3-month T-bill (rate at the exit date,
  # D11) for the rest of the month.
  monthly: arithmetic
  padding: true

tbill:
  path: data/raw/fred_tbill/DTB3.csv
  series: DTB3

exclude_dates: {}                     # per twin, rows dropped from the trading panel

# Table VI (quant_lab.models.dejong_risk, step 17).
table6:
  # [PAPER-DERIVED] FF 3-F with the S&P 500 excess return as the market factor;
  # the S&P 500 log returns of the RD/Shell workbook's regression sheet
  # (every Datastream business day of 1980-2002), SMB and HML from French.
  market: {twin: rd_shell, column: "S&P 500"}
  factors: {path: data/raw/french_ff/F-F_Research_Data_Factors_daily_CSV.zip}
  month_days: 22                      # [PAPER-DERIVED] % per month = daily x 22; annualized x 12
  days_per_year: 260                  # [IMPLEMENTATION-ASSUMPTION] rf = DTB3 / 260, as in the engine
  # [PAPER-DERIVED, identified, D23] the paper's sigma columns are the standard
  # deviation of daily returns "expressed in % per month" (x 22), not x sqrt(260):
  # its S&P 500 sigma is our daily one x 21.7-21.9 in every strategy.
  volatility_scale: 22
  # Table VI is computed for the primary configuration and every step-16 variant.
  # The paper's p. 515 cases: benchmark (10%/5%/12 months) FF3 alpha (evidence S53).
  sensitivities:
    benchmark: {paper_item: "benchmark 10%/5%/12m", overrides: {}}
    commission_50bps: {paper_item: "commission 50 bps", overrides: {costs: {commission: 0.005}}}
    spread_80bps: {paper_item: "spread 80 bps", overrides: {costs: {half_spread: 0.004}}}
    rebate_1pct: {paper_item: "short rebate 1%", overrides: {account: {rebate_rate: 0.01}}}
    one_day_delay: {paper_item: "one extra trading day delay", overrides: {rules: {delay: 1}}}

# Step 18 (quant_lab.models.dejong_standard): from the paper's conventions to the
# lab's, one cumulative change at a time; every step keeps the paper's trading
# rule (thresholds, horizon), so nothing is chosen here.
standard:
  steps:
    - {name: paper, overrides: {}}
    # D15: the authors cleaned the 1997-12-19 spike (Tables III and VI)
    - {name: dexia_cleaned, overrides: {exclude_dates: {dexia: ["1997-12-19"]}}}
    # the lab's execution: decide on close t, trade on close t+1
    - {name: next_close, overrides: {rules: {delay: 1}}}
    # no position held into a unification announcement; open positions at the end
    # are marked at the last close instead of discarded
    - {name: marked_at_end, overrides: {rules: {hold_after_window: false, open_at_end: mark}}}
    # no T-bill padding and no month-long lockout after a short position
    - {name: no_padding, overrides: {rules: {lockout_days: 0}, returns: {padding: false}}}
  # time-zone gap groups follow conf/dlc/<twin>.yaml table_i.time_diff_hours

# Sensitivity cases: overrides of the settings above, each run on all strategies.
variants:
  dexia_spike_removed: {exclude_dates: {dexia: ["1997-12-19"]}}   # D15: the 1997-12-19 spike
  margin_pooled: {account: {margin_rule: pooled}}                  # D10
  price_only: {returns: {total_return: false}}                     # D2
  one_day_delay: {rules: {delay: 1}}                               # the paper's p. 515 case
