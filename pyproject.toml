[project]
name = "quant-lab"
version = "0.1.0"
description = "Reproducible quantitative research lab: paper replication, DVC data, Hydra config, MLflow tracking, VectorBT backtests."
readme = "README.md"
# Pinned to 3.12 exactly: numba/vectorbt wheels and the lockfile are resolved for one interpreter.
requires-python = "==3.12.*"
dependencies = [
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "vectorbt>=1.1.1",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM"]
