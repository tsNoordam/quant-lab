# CI: tests and lint on synthetic data only.
#
# The licensed Datastream data never leaves DVC (CLAUDE.md), so CI has no
# `dvc pull`: every real-data test skips itself when its panel is absent, and
# everything else runs on the synthetic twin pair generated inside the tests.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (synthetic data; real-data tests skip)
        run: uv run pytest -q -rs

      - name: No licensed data in the repository
        run: |
          if git ls-files | grep -E '^data/(raw|interim|processed)/.*\.(parquet|csv|xls|xlsx|zip)$'; then
            echo "licensed or derived data is tracked by git" >&2
            exit 1
          fi
